<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HardStore - Gestor de productos con React, Vite y JSON Server. Catálogo público y panel de administración con roles."
    />
    <meta name="theme-color" content="#0f172a" />
    <title>HardStore | Gestor de Productos</title>
    <script>
      try {
        const stored = localStorage.getItem('hardstore_theme')
        const theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-bs-theme', theme)
        document.documentElement.style.colorScheme = theme
      } catch {
        // Si LocalStorage no está disponible se mantiene el tema claro por defecto.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
